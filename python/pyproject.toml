[project]
name = "ai-pet-agent-service"
version = "0.1.0"
description = "Python agent service for AI Pet desktop assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "openai-agents",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.uvicorn]
host = "127.0.0.1"
port = 8787
